services:
  db:
    image: postgres:16-alpine
    container_name: chakyruu-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chakyruu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chakyruu}
      POSTGRES_DB: ${POSTGRES_DB:-chakyruu}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chakyruu}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
